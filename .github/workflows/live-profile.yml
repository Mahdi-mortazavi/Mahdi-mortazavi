# ═══════════════════════════════════════════════════════════════
# 🫀 Living Profile — regenerates the README's dynamic sections
#    and the self-hosted Liquid-Glass SVG cards from real GitHub
#    data. No third-party card service can break this profile.
# ═══════════════════════════════════════════════════════════════
name: 🫀 Living Profile

on:
  schedule:
    - cron: "7 */6 * * *"   # every 6 hours
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/live-profile.yml'
      - 'README.md'
  issues:                    # a new question shows up in "Ask Me Anything"
    types: [opened, closed, reopened, edited]
  workflow_dispatch:

concurrency:
  group: living-profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🎨 Generate live cards + README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/generate.mjs

      - name: 🚀 Commit if anything actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/live
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
            exit 0
          fi
          git commit -m "🫀 Living profile — $(TZ=Asia/Tehran date +'%Y-%m-%d %H:%M') Tehran"
          git push
