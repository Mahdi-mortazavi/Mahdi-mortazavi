    <ellipse cx="840" cy="40" rx="216" ry="249" fill="url(#aura1)"/>
    <ellipse cx="60" cy="518" rx="234" ry="249" fill="url(#aura2)"/>
  </g>
  <rect width="900" height="498" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#hair)"/>
