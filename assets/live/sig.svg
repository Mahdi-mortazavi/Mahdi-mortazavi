<svg xmlns="http://www.w3.org/2000/svg" width="900" height="168" viewBox="0 0 900 168" role="img"
  aria-label="Built by Mahdi Mortazavi — CTO &amp; product engineer — from first principles to shipped products.">
  <title>Built by Mahdi Mortazavi · مهدی مرتضوی</title>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="55%" stop-color="#0B0F18"/>
      <stop offset="100%" stop-color="#10151F"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF375F" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="coreglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="900" height="168" rx="22" fill="url(#bg)"/>
  
  <rect width="900" height="168" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#hair)"/>
  <g filter="url(#soft)" opacity=".6"><ellipse cx="90" cy="84" rx="200" ry="110" fill="url(#aura1)"/></g>
  <circle cx="92" cy="84" r="34" fill="url(#mark)"/>
  <circle cx="92" cy="84" r="34" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="92" cy="84" r="46" fill="none" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.6" stroke-dasharray="4 10" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 92 84" to="360 92 84" dur="16s" repeatCount="indefinite"/></circle>
  <text x="92" y="97" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">M</text>
  <text x="166" y="58" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="21" font-weight="700" letter-spacing="2.6" fill="#FF375F">BUILT BY</text>
  <text x="164" y="104" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#F5F5F7">Mahdi Mortazavi</text>
  <circle cx="174" cy="134" r="6.5" fill="#30D158"/>
  <circle cx="174" cy="134" r="6.5" fill="none" stroke="#30D158"><animate attributeName="r" values="6.5;15;6.5" dur="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="192" y="142" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="600" fill="#A9AEBA">Open to remote work · see my other work</text>
  <g transform="translate(816 70)" stroke="#F5F5F7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M0 28 L28 0 M6 0 H28 V22"/></g>
</svg>