<svg xmlns="http://www.w3.org/2000/svg" width="700" height="310" viewBox="0 0 700 310" role="img"
  aria-label="Mahdi Mortazavi has 294 GitHub stars; the growth curve starts tracking today">
  <title>294 stars across all repositories — growth tracking starts today</title>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FF9F0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF375F" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="coreglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="700" height="310" rx="22" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity=".85">
    <ellipse cx="640" cy="40" rx="200" ry="150" fill="url(#aura1)"/>
    <ellipse cx="60" cy="330" rx="220" ry="150" fill="url(#aura2)"/>
  </g>
  <rect width="700" height="310" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="700" height="3" fill="url(#hair)"/>
  
  <text x="40" y="48" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#FF9F0A">GROWTH · رشد</text>
  <text x="40" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="74" font-weight="800" letter-spacing="-2" fill="#F5F5F7">294<tspan dx="14" font-size="25" font-weight="600" letter-spacing="0" fill="#A1A1A6">total stars</tspan></text>
  <text x="40" y="158" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="500" fill="#8A93A3">across 10 public repositories · the curve fills in</text><text x="40" y="185" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="500" fill="#8A93A3">from today</text>
  <line x1="40" y1="230" x2="660" y2="230" stroke="#FF9F0A" stroke-opacity=".35" stroke-width="2.5" stroke-dasharray="6 8" stroke-linecap="round"/>
  <circle cx="660" cy="230" r="6" fill="#FFFFFF"/>
  <circle cx="660" cy="230" r="6" fill="none" stroke="#FFFFFF" stroke-opacity=".7">
    <animate attributeName="r" values="6;17;6" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values=".7;0;.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <text x="40" y="270" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#8A93A3">today</text>
  <text x="660" y="270" text-anchor="end" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="21" fill="#8A93A3">next snapshot in 6h</text>
</svg>