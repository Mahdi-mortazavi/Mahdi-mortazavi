    </path><path fill="url(#wave)" fill-opacity="0.26" d="M-450,74 C -225,50 0,98 225,74 C 450,50 675,98 900,74 C 1125,50 1350,98 1350,74 L1350,128 L-450,128 Z">
      <animateTransform attributeName="transform" type="translate"
        values="150 0;-300 0" dur="13s" repeatCount="indefinite"/>
    </path><path fill="url(#wave)" fill-opacity="0.46" d="M-450,93 C -225,77 0,109 225,93 C 450,77 675,109 900,93 C 1125,77 1350,109 1350,93 L1350,128 L-450,128 Z">
      <animateTransform attributeName="transform" type="translate"
        values="300 0;-150 0" dur="9s" repeatCount="indefinite"/>
    </path>
