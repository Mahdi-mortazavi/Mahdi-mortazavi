<svg xmlns="http://www.w3.org/2000/svg" width="900" height="128" viewBox="0 0 900 128" role="img"
  aria-label="Decorative footer">
  <title>Mahdi Mortazavi · مهدی مرتضوی</title>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FF9F0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF375F" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF9F0A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF9F0A"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="coreglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
  </defs>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FF9F0A"/><stop offset="100%" stop-color="#FF375F"/>
  </linearGradient>
  <rect width="900" height="128" fill="#0D1117"/>
  <path fill="url(#wave)" fill-opacity="0.16" d="M-450,54 C -225,22 0,86 225,54 C 450,22 675,86 900,54 C 1125,22 1350,86 1350,54 L1350,128 L-450,128 Z">
      <animateTransform attributeName="transform" type="translate"
