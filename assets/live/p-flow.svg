    </filter>
    <filter id="coreglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="900" height="604" rx="22" fill="url(#bg)"/>
  
  <rect width="900" height="604" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#hair)"/>
  <g filter="url(#soft)" opacity=".55"><ellipse cx="212" cy="160" rx="230" ry="150" fill="url(#aura1)"/></g>
