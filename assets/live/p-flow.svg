<svg xmlns="http://www.w3.org/2000/svg" width="900" height="604" viewBox="0 0 900 604" role="img"
  aria-label="Flow — One decision a day. An offline-first focus and habit app grounded in behavioural science.">
  <title>Flow — One decision a day. An offline-first focus and habit app grounded in behavioural science.</title>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
