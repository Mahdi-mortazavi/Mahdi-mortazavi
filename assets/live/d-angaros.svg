<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1242" viewBox="0 0 900 1242" role="img" aria-label="How Angaros works: the phone seals messages with AES-256-GCM, a self-hosted Cloudflare relay stores only ciphertext, and the computer exposes them to AI agents as MCP tools">
