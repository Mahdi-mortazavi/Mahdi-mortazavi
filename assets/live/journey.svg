    <text x="108" y="139" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#A9AEBA">2023</text>
        <text x="108" y="188" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-.6" fill="#F5F5F7">Senagh<tspan dx="16" font-size="28" font-weight="650" letter-spacing="0" fill="#30D1D0">CTO &amp; Head of Product</tspan></text>
        <text x="108" y="230" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">AI-agent assistant for real-estate agents. I</text><text x="108" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">own architecture and product.</text><circle cx="64" cy="338" r="10" fill="#07090E" stroke="#30D1D0" stroke-width="3.2"/>
    <text x="108" y="347" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#A9AEBA">2025</text>
        <text x="108" y="396" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-.6" fill="#F5F5F7">Open source<tspan dx="16" font-size="28" font-weight="650" letter-spacing="0" fill="#30D1D0">First public release</tspan></text>
        <text x="108" y="438" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">Started shipping my tools in the open,</text><text x="108" y="476" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">bilingual and free.</text><circle cx="64" cy="546" r="10" fill="#07090E" stroke="#30D1D0" stroke-width="3.2"/>
    <text x="108" y="555" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#A9AEBA">2026</text>
        <text x="108" y="604" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-.6" fill="#F5F5F7">relay<tspan dx="16" font-size="28" font-weight="650" letter-spacing="0" fill="#30D1D0">239 stars</tspan></text>
        <text x="108" y="646" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">Reverse tethering over WireGuard, used on</text><text x="108" y="684" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">real devices every day.</text><circle cx="64" cy="754" r="10" fill="#30D158" stroke="#30D158" stroke-width="3.2"/>
    <circle cx="64" cy="754" r="10" fill="none" stroke="#30D158">
      <animate attributeName="r" values="10;26;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/></circle><text x="108" y="763" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="27" font-weight="700" fill="#30D158">NOW</text>
        <text x="108" y="812" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="800" letter-spacing="-.6" fill="#F5F5F7">Zista Health<tspan dx="16" font-size="28" font-weight="650" letter-spacing="0" fill="#30D1D0">Co-founder &amp; CTO</tspan></text>
        <text x="108" y="854" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">AI-powered remote patient monitoring, from</text><text x="108" y="892" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="28" font-weight="500" fill="#7F8898">the wearable to the apps.</text>
