<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="How relay works: the phone runs a WireGuard endpoint, the PC runs a WireGuard client, and every app on the PC goes through the encrypted tunnel">
  <title>How relay works: the phone runs a WireGuard endpoint, the PC runs a WireGuard client, and every app on the PC goes through the encrypted tunnel</title>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="55%" stop-color="#0B0F18"/>
      <stop offset="100%" stop-color="#10151F"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF375F" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#FF375F"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#FF375F" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="coreglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="400" rx="22" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity=".8">
    <ellipse cx="1540" cy="40" rx="384" ry="200" fill="url(#aura1)"/>
    <ellipse cx="60" cy="420" rx="416" ry="200" fill="url(#aura2)"/>
  </g>
  <rect width="1600" height="400" rx="22" fill="url(#grid)"/>
  <rect x="0" y="0" width="1600" height="3" fill="url(#hair)"/><text x="64" y="66" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="23" font-weight="700" letter-spacing="2.6" fill="#FF375F">RELAY · DATA PATH</text><g>
    <rect x="64" y="112" width="377.3333333333333" height="196" rx="26" fill="url(#glass)"/>
    <rect x="64" y="112" width="377.3333333333333" height="196" rx="26" fill="none" stroke="rgba(255,255,255,.14)"/>
    <path d="M 90 112.75 H 415.3333333333333" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
    <text x="94" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-.5" fill="#F5F5F7">Android phone</text>
    <text x="94" y="212" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#FF375F">WIREGUARD ENDPOINT</text><text x="94" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#A9AEBA">Kotlin · Compose · Go</text><path d="M451.3333333333333 210 H601.3333333333333" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="26;0" dur="1.2s" repeatCount="indefinite"/></path>
          <circle r="5.5" fill="url(#mark)">
      <animateMotion dur="2.4s" begin="-0.00s" repeatCount="indefinite" path="M451.3333333333333 210 H601.3333333333333" />
    </circle><circle r="5.5" fill="url(#mark)">
      <animateMotion dur="2.4s" begin="-0.80s" repeatCount="indefinite" path="M451.3333333333333 210 H601.3333333333333" keyPoints="1;0" keyTimes="0;1" calcMode="linear"/>
    </circle><circle r="5.5" fill="url(#mark)">
      <animateMotion dur="2.4s" begin="-1.60s" repeatCount="indefinite" path="M451.3333333333333 210 H601.3333333333333" />
    </circle>
          <text x="526.3333333333333" y="162" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="600" fill="#7F8898">encrypted</text><text x="526.3333333333333" y="188" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="600" fill="#7F8898">tunnel</text><g>
    <rect x="611.3333333333333" y="112" width="377.3333333333333" height="196" rx="26" fill="url(#glass)"/>
    <rect x="611.3333333333333" y="112" width="377.3333333333333" height="196" rx="26" fill="none" stroke="rgba(255,255,255,.14)"/>
    <path d="M 637.3333333333333 112.75 H 962.6666666666665" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
    <text x="641.3333333333333" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-.5" fill="#F5F5F7">Windows PC</text>
    <text x="641.3333333333333" y="212" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#FF375F">WIREGUARD CLIENT</text><text x="641.3333333333333" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#A9AEBA">.NET 8 · WinUI 3 · Go</text><path d="M998.6666666666665 210 H1148.6666666666665" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="26;0" dur="1.2s" repeatCount="indefinite"/></path>
          <circle r="5.5" fill="url(#mark)">
      <animateMotion dur="2.4s" begin="-0.00s" repeatCount="indefinite" path="M998.6666666666665 210 H1148.6666666666665" />
    </circle><circle r="5.5" fill="url(#mark)">
      <animateMotion dur="2.4s" begin="-0.80s" repeatCount="indefinite" path="M998.6666666666665 210 H1148.6666666666665" keyPoints="1;0" keyTimes="0;1" calcMode="linear"/>
    </circle><circle r="5.5" fill="url(#mark)">
      <animateMotion dur="2.4s" begin="-1.60s" repeatCount="indefinite" path="M998.6666666666665 210 H1148.6666666666665" />
    </circle>
          <text x="1073.6666666666665" y="188" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="19" font-weight="600" fill="#7F8898">system route</text><g>
    <rect x="1158.6666666666665" y="112" width="377.3333333333333" height="196" rx="26" fill="url(#glass)"/>
    <rect x="1158.6666666666665" y="112" width="377.3333333333333" height="196" rx="26" fill="none" stroke="rgba(255,255,255,.14)"/>
    <path d="M 1184.6666666666665 112.75 H 1509.9999999999998" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
    <text x="1188.6666666666665" y="170" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="34" font-weight="800" letter-spacing="-.5" fill="#F5F5F7">Every app</text>
    <text x="1188.6666666666665" y="212" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="22" font-weight="700" fill="#FF375F">WHOLE SYSTEM</text><text x="1188.6666666666665" y="246" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="500" fill="#A9AEBA">TCP and UDP, no leaks</text><text x="64" y="362" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="600" fill="#A9AEBA">No server in the middle. Keys are made at pairing and destroyed when sharing stops.</text>
</svg>