<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="How Angaros works: the phone seals messages with AES-256-GCM, a self-hosted Cloudflare relay stores only ciphertext, and the computer exposes them to AI agents as MCP tools">
  <title>How Angaros works: the phone seals messages with AES-256-GCM, a self-hosted Cloudflare relay stores only ciphertext, and the computer exposes them to AI agents as MCP tools</title>
  
  <defs>
