<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="118" viewBox="0 0 1600 118" role="img"
  aria-label="Decorative footer">
  <title>Mahdi Mortazavi · مهدی مرتضوی</title>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <radialGradient id="aura1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#5E5CE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0A84FF" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".13"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".045"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#0A84FF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5E5CE6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5E5CE6"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="coreglow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
  </defs>
  <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#5E5CE6"/><stop offset="100%" stop-color="#0A84FF"/>
  </linearGradient>
  <rect width="1600" height="118" fill="#0D1117"/>
  <path fill="url(#wave)" fill-opacity="0.16" d="M-800,54 C -400,22 0,86 400,54 C 800,22 1200,86 1600,54 C 2000,22 2400,86 2400,54 L2400,118 L-800,118 Z">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-800 0" dur="19s" repeatCount="indefinite"/>
    </path><path fill="url(#wave)" fill-opacity="0.26" d="M-800,74 C -400,50 0,98 400,74 C 800,50 1200,98 1600,74 C 2000,50 2400,98 2400,74 L2400,118 L-800,118 Z">
      <animateTransform attributeName="transform" type="translate"
        values="150 0;-650 0" dur="13s" repeatCount="indefinite"/>
    </path><path fill="url(#wave)" fill-opacity="0.46" d="M-800,93 C -400,77 0,109 400,93 C 800,77 1200,109 1600,93 C 2000,77 2400,109 2400,93 L2400,118 L-800,118 Z">
      <animateTransform attributeName="transform" type="translate"
        values="300 0;-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
  <rect x="0" y="0" width="1600" height="2.5" fill="url(#hair)"/>
